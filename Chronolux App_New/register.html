<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronoLux - Registration</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            background-color: white;
            padding: 30px;
            width: 400px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0px 4px 10px rgba(255,255,255,0.2);
        }

        input, textarea, button {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
        }

        button {
            background-color: black;
            color: white;
            border: none;
            cursor: pointer;
        }

        .link-text {
            color: blue;
            text-decoration: none;
        }

        .info {
            text-align: left;
            margin-top: 15px;
            padding: 10px;
            background-color: #f4f4f4;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>Create Your Profile</h2>

        <form action="login.html">
            <input type="text" placeholder="Full Name"
                   value="Divya S" required><br>

            <input type="email" placeholder="Email Address"
                   value="Divya@gmail.com" required><br>

            <input type="tel" placeholder="Phone Number"
                   value="9876543210" required><br>

            <textarea rows="3" required>#19, 3rd Cross, Vijinapura, Bangalore - 43</textarea><br>

            <button type="submit">Register Account</button>
        </form>

        <div class="info">
            <strong>Phone:</strong> 9876543210<br>
            <strong>Address:</strong> #19, 3rd Cross,
            Vijinapura, Bangalore - 43
        </div>

        <p>
            <a class="link-text" href="login.html">
                ← Previous (Back to Login)
            </a>
        </p>
    </div>
</body>
</html>
